<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Odin Project | Calculator</title>
    <meta
      name="description"
      content="A simple calculator app made using vanilla JavaScript in partial fulfillment of the requirements of The Odin Prjoect."
    />
    <meta name="author" content="@Exc1D" />

    <!-- Preconnect for Performance (Fonts, APIs, etc.) -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/assets/favicon_io/favicon.ico"
      type="image/x-icon"
    />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="The Odin Project | Calculator" />
    <meta
      property="og:description"
      content="A simple calculator app made using vanilla JavaScript in partial fulfillment of the requirements of The Odin Prjoect."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:image" content="https://example.com/og-image.png" />
  </head>

  <body>
    <!-- Main Content -->
    <main class="calculator-container">
      <div class="display-container">
        <div class="previous-display"></div>
        <div class="current-display">0</div>
      </div>
      <div class="buttons">
        <button data-operator="/">&divide;</button>
        <button class="clear operator">AC</button>
        <button class="delete operator">DEL</button>
        <br />
        <button data-operator="*">&times;</button>
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button data-operator="-">-</button>
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-operator="+">+</button>
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-number="0">0</button>
        <button class="decimal">.</button>
        <button class="equals operator">=</button>
      </div>
    </main>

    <!-- Footer -->
    <footer role="contentinfo">
      <p>&copy; 2025 Exc1D. All rights reserved.</p>
      <a
        href="https://www.flaticon.com/free-icons/calculator"
        title="calculator icons"
        >Calculator icons created by logisstudio - Flaticon</a
      >
    </footer>
    <!-- Scripts (Defer for Performance) -->
    <script src="script.js" defer></script>

    <!-- Reveal page after CSS loads -->
    <script>
      document.documentElement.style.visibility = "visible";
    </script>
  </body>
</html>
